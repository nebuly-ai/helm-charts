nvidia-device-plugin:
  enabled: true

secrets-store-csi-driver:
  enabled: true
  syncSecret:
    enabled: true

traefik:
  enabled: true
  ingressClass:
    enabled: true
    isDefaultClass: true
    name: traefik
  providers:
    kubernetesIngress:
      enabled: true
      ingressClass: traefik
  service:
    spec:
      type: LoadBalancer

cert-manager:
  enabled: true
  crds:
    enabled: true

gpu-operator:
  enabled: true
  hostPaths:
    driverInstallDir: /home/kubernetes/bin/nvidia
  toolkit:
    installDir: /home/kubernetes/bin/nvidia
  cdi:
    enabled: true
    default: true
  driver:
    enabled: false