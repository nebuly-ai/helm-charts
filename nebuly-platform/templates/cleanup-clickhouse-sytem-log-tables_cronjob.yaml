{{- if .Values.clickhouse.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cleanup-clickhouse-sytem-log-tables
  namespace: {{ include "nebuly-platform.namespace" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
  annotations:
    {{- include "nebuly-platform.annotations" . | nindent 4 }}
spec:
  schedule: "0 0 30 2 *" # Never
  suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    metadata:
      labels:
        {{- include "backend.labels" . | nindent 8 }}
    spec:
      backoffLimit: 1
      template:
        metadata:
          {{- with .Values.backend.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          labels:
            {{- include "backend.labels" . | nindent 12 }}
            {{- with .Values.backend.podLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        spec:
          serviceAccountName: {{ include "backend.serviceAccountName" . }}
          restartPolicy: Never
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.backend.podSecurityContext | nindent 12 }}
          containers:
            - name: cleanup-clickhouse-sytem-log-tables
              securityContext:
                {{- toYaml .Values.backend.securityContext | nindent 16 }}
              image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
              command:
                - python
                - scripts/cleanup_system_log_tables.py
              env:
                - name: "OTEL_SERVICE_NAME"
                  value: "nebuly-backend"
                {{ include "backend.commonEnv" . | nindent 16 }}
              resources:
                requests:
                  cpu: 100m
                limits:
                  memory: 512Mi
              {{- with .Values.backend.volumeMounts }}
              volumeMounts:
                {{- toYaml . | nindent 16 }}
              {{- end }}
          {{- with .Values.backend.volumes }}
          volumes:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
