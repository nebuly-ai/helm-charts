{{- if and .Values.agent.enabled .Values.agent.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-%s" .Release.Name "agent-migrations" | trunc 63 | trimSuffix "-" }}
  namespace: {{ include "nebuly-platform.namespace" . }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
  annotations:
    # The agent's chat history schema is migrated here, before any replica starts, so
    # that replicas never race to run the chain themselves. The agent is deployed with
    # MIGRATE_ON_STARTUP=false and only checks that the schema is present.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.agent.migrations.backoffLimit }}
  template:
    metadata:
      name: {{ printf "%s-%s" .Release.Name "agent-migrations" | trunc 63 | trimSuffix "-" }}
      labels:
        {{- include "agent.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.agent.podSecurityContext | nindent 8 }}
      containers:
        - name: agent-migrations
          securityContext:
            {{- toYaml .Values.agent.securityContext | nindent 12 }}
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          command:
            - python
            - -m
            - app.history.migrate
            - up
          resources:
            {{- toYaml .Values.agent.migrations.resources | nindent 12 }}
          env:
            {{- include "agent.databaseEnv" . | nindent 12 }}
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
