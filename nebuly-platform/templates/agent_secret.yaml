{{- if and .Values.agent.enabled (not .Values.agent.existingSecret.name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent.fullname" . }}
  namespace: {{ include "nebuly-platform.namespace" . }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
  annotations:
    {{- include "nebuly-platform.annotations" . | nindent 4 }}
stringData:
  {{ .Values.agent.existingSecret.databaseUrlKey | default "agent-database-url" }}: {{ .Values.agent.databaseUrl | quote }}
{{- end }}
