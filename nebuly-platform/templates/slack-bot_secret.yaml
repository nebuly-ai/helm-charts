{{- if and .Values.slackBot.enabled (not .Values.slackBot.existingSecret.name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "slackBot.fullname" . }}
  namespace: {{ include "nebuly-platform.namespace" . }}
  labels:
    {{- include "slackBot.labels" . | nindent 4 }}
  annotations:
    {{- include "nebuly-platform.annotations" . | nindent 4 }}
stringData:
  {{ .Values.slackBot.existingSecret.clientIdKey | default "slack-client-id" }}: {{ .Values.slackBot.clientId | quote }}
  {{ .Values.slackBot.existingSecret.clientSecretKey | default "slack-client-secret" }}: {{ .Values.slackBot.clientSecret | quote }}
  {{ .Values.slackBot.existingSecret.appTokenKey | default "slack-app-token" }}: {{ .Values.slackBot.appToken | quote }}
  {{ .Values.slackBot.existingSecret.encryptionKeyKey | default "slack-bot-encryption-key" }}: {{ .Values.slackBot.encryptionKey | quote }}
{{- end }}
